version: '3.8'

services:
  sakura-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sakura-ai-bot
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # Ensure proper network access
    network_mode: bridge
    # DNS configuration (helps with discord.com resolution)
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s